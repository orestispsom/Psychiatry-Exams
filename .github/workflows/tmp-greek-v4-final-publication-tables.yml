name: Temporary Greek v4 final publication with tables

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-v4-final:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved publication system
        uses: actions/checkout@v4
        with:
          ref: main
          path: layout

      - name: Checkout locked v4 manuscript
        uses: actions/checkout@v4
        with:
          ref: 2292f01056d4b4f545d5efadf47e4243a1b3b2c0
          path: source

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-extra poppler-utils ghostscript
          python -m pip install --quiet reportlab pymupdf pypdf

      - name: Freeze final v4 production master
        run: |
          cp layout/oral/100-crucial-questions/publication/final-greek-v3/Greek_publication_master_v3.py /tmp/Greek_publication_master_v4.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/Greek_publication_master_v4.py')
          s=p.read_text('utf-8')
          s=s.replace('oral/100-crucial-questions/answers/revision-v3-el','oral/100-crucial-questions/answers/final-v4-el')
          s=s.replace('63a844d881072d13fd6e33423b9e01fb8f91f0d9','2292f01056d4b4f545d5efadf47e4243a1b3b2c0')
          s=s.replace("SYMBOLS=re.compile(r'([→≥≤≠−])')", "SYMBOLS=re.compile(r'([→≥≤≠−↑↓↔])')")
          s=s.replace('The_100_Crucial_Questions_in_Psychiatry_v3_GREEK_COMPLETE_A4.pdf','The_100_Crucial_Questions_in_Psychiatry_v4_GREEK_COMPLETE_A4.pdf')

          a=s.index('def blocks(lines):')
          b=s.index('def section_kind(h):')
          new_blocks=r'''def blocks(lines):
    out=[]; buf=[]; i=0
    def flush():
        nonlocal buf
        if buf: out.append(('p',' '.join(x.strip() for x in buf))); buf=[]
    while i < len(lines):
        ln=lines[i]
        if ln.lstrip().startswith('|'):
            flush(); rows=[]
            while i < len(lines) and lines[i].lstrip().startswith('|'):
                rows.append(lines[i].strip()); i+=1
            out.append(('table',rows)); continue
        if ln.startswith('### '): flush(); out.append(('h3',ln[4:].strip()))
        elif re.match(r'^\s*[-•]\s+',ln): flush(); out.append(('bullet',re.sub(r'^\s*[-•]\s+','',ln)))
        elif re.match(r'^\s*\d+\.\s+',ln): flush(); out.append(('num',re.sub(r'^\s*\d+\.\s+','',ln)))
        elif ln.strip()=='': flush()
        else: buf.append(ln)
        i+=1
    flush(); return out

'''
          s=s[:a]+new_blocks+s[b:]

          marker='def historical_box(blks):\n'
          table_fn=r'''def markdown_table(raw_rows):
    rows=[]
    for line in raw_rows:
        cells=[c.strip() for c in line.strip().strip('|').split('|')]
        if cells and all(re.fullmatch(r':?-{3,}:?',c.replace(' ','')) for c in cells):
            continue
        rows.append(cells)
    if not rows: return Spacer(1,1)
    n=max(len(r) for r in rows)
    for r in rows: r.extend(['']*(n-len(r)))
    body=ParagraphStyle('tablebody-v4',parent=styles['body'],fontSize=8.8,leading=11.2,spaceAfter=0)
    head=ParagraphStyle('tablehead-v4',parent=body,fontName='SansB',fontSize=8.5,leading=10.8,textColor=TEXT)
    data=[]
    for ri,row in enumerate(rows):
        st=head if ri==0 else body
        data.append([Paragraph(rich(c),st) for c in row])
    if n==2: widths=[35*mm,BODY_W-35*mm]
    else: widths=[BODY_W/n]*n
    tab=Table(data,colWidths=widths,hAlign='LEFT',repeatRows=1,splitByRow=1)
    cmds=[('VALIGN',(0,0),(-1,-1),'TOP'),('GRID',(0,0),(-1,-1),0.35,RULE),('BACKGROUND',(0,0),(-1,0),LIGHT),('LEFTPADDING',(0,0),(-1,-1),5),('RIGHTPADDING',(0,0),(-1,-1),5),('TOPPADDING',(0,0),(-1,-1),5),('BOTTOMPADDING',(0,0),(-1,-1),5)]
    tab.setStyle(TableStyle(cmds)); return tab

'''
          assert marker in s
          s=s.replace(marker,table_fn+marker,1)

          s=s.replace("                elif typ in ('bullet','num'): story.append(Paragraph('• '+rich(txt),styles['bullet']))\n                    i+=1", "                elif typ in ('bullet','num'): story.append(Paragraph('• '+rich(txt),styles['bullet']))\n                elif typ=='table': story.append(markdown_table(txt)); story.append(Spacer(1,2*mm))\n                i+=1", 1)
          s=s.replace("                elif typ=='h3': story.append(Paragraph(rich(txt),styles['followq']))", "                elif typ=='h3': story.append(Paragraph(rich(txt),styles['followq']))\n                elif typ=='table': story.append(markdown_table(txt)); story.append(Spacer(1,2*mm))", 1)

          a=s.index('def source_lines(q):')
          b=s.index('def question_pdf_text(')
          source_fn=r'''def source_lines(q):
    txt=Path(q['path']).read_text(encoding='utf-8')
    out=[]
    for line in txt.splitlines():
        z=line.strip()
        if not z or z.startswith('## '): continue
        if z.startswith('|'):
            cells=[c.strip() for c in z.strip('|').split('|')]
            if cells and all(re.fullmatch(r':?-{3,}:?',c.replace(' ','')) for c in cells): continue
            for c in cells:
                c=plain_md(c)
                if len(c)>=2: out.append(c)
            continue
        if z.startswith('# '): z=re.sub(r'^#\s+Q\d+\.\s*','',z)
        elif z.startswith('### '):
            z=z[4:]; z=re.sub(r'^Q\d+[a-z]?\.\s*','',z,flags=re.I)
        z=re.sub(r'^\d+\.\s*','',z); z=re.sub(r'^[-•]\s*','',z); z=plain_md(z)
        if len(z)>=2: out.append(z)
    return out

'''
          s=s[:a]+source_fn+s[b:]
          p.write_text(s,'utf-8')
          print('MASTER_SHA256',__import__('hashlib').sha256(p.read_bytes()).hexdigest())
          PY
          python -m py_compile /tmp/Greek_publication_master_v4.py

      - name: Verify locked corpus
        run: |
          set -e
          ROOT=source/oral/100-crucial-questions/answers/final-v4-el
          test "$(find "$ROOT" -maxdepth 1 -type f -name 'Q???.md' | wc -l)" -eq 100
          python - <<'PY'
          from pathlib import Path
          root=Path('source/oral/100-crucial-questions/answers/final-v4-el')
          assert sorted(p.name for p in root.glob('Q???.md')) == [f'Q{i:03d}.md' for i in range(1,101)]
          print('CORPUS_OK 100/100 ORDER_OK')
          PY
          grep -R '^### Q' "$ROOT" > /tmp/followups_source.txt || true
          grep -R '^|' "$ROOT" > /tmp/tables_source.txt || true

      - name: Build final candidate
        working-directory: source
        env:
          GREEK_SRC: oral/100-crucial-questions/answers/final-v4-el
          GREEK_OUT: ../output
          SOURCE_COMMIT: 2292f01056d4b4f545d5efadf47e4243a1b3b2c0
        run: python /tmp/Greek_publication_master_v4.py | tee ../build.log

      - name: Package and technical checks
        run: |
          set -e
          PDF=output/The_100_Crucial_Questions_in_Psychiatry_v4_GREEK_COMPLETE_A4.pdf
          cp /tmp/Greek_publication_master_v4.py output/Greek_publication_master_v4.py
          cp output/GREEK_COMPLETE_QA_report.json output/GREEK_V4_COMPLETE_QA_report.json
          cp output/GREEK_COMPLETE_book_manifest.json output/GREEK_V4_COMPLETE_book_manifest.json
          cp /tmp/followups_source.txt output/followups_source.txt
          cp /tmp/tables_source.txt output/tables_source.txt
          pdfinfo "$PDF" > output/pdfinfo.txt
          pdffonts "$PDF" > output/pdffonts.txt
          ! grep -E 'Helvetica|Times-Roman|Courier|ZapfDingbats' output/pdffonts.txt
          git -C source ls-tree -r 2292f01056d4b4f545d5efadf47e4243a1b3b2c0 -- oral/100-crucial-questions/answers/final-v4-el > output/source_tree.txt
          cp build.log output/build.log
          sha256sum "$PDF" output/Greek_publication_master_v4.py > output/SHA256SUMS.txt

      - name: Upload final candidate
        uses: actions/upload-artifact@v4
        with:
          name: greek-v4-final-publication-tables
          if-no-files-found: error
          path: output/
