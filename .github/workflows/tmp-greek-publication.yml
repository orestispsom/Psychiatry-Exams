name: Temporary Greek publication build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-greek-publication:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tooling branch
        uses: actions/checkout@v4
        with:
          path: tooling

      - name: Checkout frozen Greek source snapshot
        uses: actions/checkout@v4
        with:
          ref: ab617961440309f7f32677c56122b3f525215c03
          path: source

      - name: Install publication dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-extra poppler-utils ghostscript
          python -m pip install --quiet reportlab pymupdf
          gzip -dc tooling/.tmp/greek_publication_build.py.gz > /tmp/greek_publication_build.py

      - name: Build Greek A4 book
        id: build
        continue-on-error: true
        working-directory: source
        env:
          GREEK_SRC: oral/100-crucial-questions/answers/revision-v2-el
          GREEK_OUT: ../output
          SOURCE_COMMIT: ab617961440309f7f32677c56122b3f525215c03
        run: python /tmp/greek_publication_build.py | tee ../build.log

      - name: Technical PDF checks
        if: always()
        run: |
          if [ -f output/The_100_Crucial_Questions_in_Psychiatry_v2_GREEK_COMPLETE_A4.pdf ]; then
            pdfinfo output/The_100_Crucial_Questions_in_Psychiatry_v2_GREEK_COMPLETE_A4.pdf > output/pdfinfo.txt
            pdffonts output/The_100_Crucial_Questions_in_Psychiatry_v2_GREEK_COMPLETE_A4.pdf > output/pdffonts.txt
          fi
          tar -czf output/greek_sources_frozen.tgz -C source oral/100-crucial-questions/answers/revision-v2-el
          cp build.log output/build.log || true

      - name: Upload Greek publication artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greek-publication-candidate
          if-no-files-found: error
          path: |
            output/The_100_Crucial_Questions_in_Psychiatry_v2_GREEK_COMPLETE_A4.pdf
            output/GREEK_COMPLETE_book_manifest.json
            output/GREEK_COMPLETE_QA_report.json
            output/pdfinfo.txt
            output/pdffonts.txt
            output/build.log
            output/greek_sources_frozen.tgz
