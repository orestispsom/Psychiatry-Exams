name: Temporary Greek v3 publication build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-greek-publication:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tooling branch
        uses: actions/checkout@v4
        with:
          path: tooling

      - name: Checkout frozen Greek v3 source snapshot
        uses: actions/checkout@v4
        with:
          ref: 63a844d881072d13fd6e33423b9e01fb8f91f0d9
          path: source

      - name: Install publication dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-extra poppler-utils ghostscript
          python -m pip install --quiet reportlab pymupdf pypdf
          gzip -dc tooling/.tmp/greek_publication_build.py.gz > /tmp/Greek_publication_master_v3.py

      - name: Apply final v3 production-only fixes to established master
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/Greek_publication_master_v3.py')
          s=p.read_text('utf-8')
          s=s.replace('import fitz\n', 'import fitz\nfrom pypdf import PdfReader, PdfWriter\n', 1)
          s=s.replace("SRC = Path(os.environ.get('GREEK_SRC','oral/100-crucial-questions/answers/revision-v2-el'))", "SRC = Path(os.environ.get('GREEK_SRC','oral/100-crucial-questions/answers/revision-v3-el'))", 1)
          s=s.replace("SOURCE_COMMIT=os.environ.get('SOURCE_COMMIT','ab617961440309f7f32677c56122b3f525215c03')", "SOURCE_COMMIT=os.environ.get('SOURCE_COMMIT','63a844d881072d13fd6e33423b9e01fb8f91f0d9')", 1)
          s=s.replace("SYMBOLS=re.compile(r'([→≥≤≠])')", "SYMBOLS=re.compile(r'([→≥≤≠−])')", 1)
          s=s.replace("def plain_md(s):\n    s=re.sub(r'\\*\\*|\\*','',s)\n    return s.strip()", "def plain_md(s):\n    s=re.sub(r'\\*\\*(.+?)\\*\\*',r'\\1',s)\n    s=re.sub(r'(?<!\\w)\\*([^*]+?)\\*(?!\\w)',r'\\1',s)\n    return s.strip()", 1)
          s=s.replace("final=OUT/'The_100_Crucial_Questions_in_Psychiatry_v2_GREEK_COMPLETE_A4.pdf'", "final=OUT/'The_100_Crucial_Questions_in_Psychiatry_v3_GREEK_COMPLETE_A4.pdf'", 1)

          insert='''\ndef remove_unused_base14_f1(path):\n    \"\"\"Remove ReportLab's unused /F1 Helvetica resource only when no page content stream references /F1.\"\"\"\n    reader=PdfReader(str(path))\n    for page in reader.pages:\n        c=page.get_contents()\n        if c and b'/F1' in c.get_data():\n            raise RuntimeError('Refusing Helvetica cleanup: /F1 is referenced by visible page content')\n    writer=PdfWriter(clone_from=reader)\n    removed=0\n    for page in writer.pages:\n        res=page.get('/Resources')\n        fonts=res.get('/Font') if res else None\n        if fonts and '/F1' in fonts:\n            del fonts['/F1']; removed+=1\n    tmp=Path(str(path)+'.clean.tmp')\n    with tmp.open('wb') as fh:\n        writer.write(fh)\n    tmp.replace(path)\n    return removed\n\n'''
          marker='def norm(s):\n'
          assert marker in s
          s=s.replace(marker,insert+marker,1)

          start=s.index('def source_chunks(q):')
          end=s.index("if __name__=='__main__':")
          qa_block='''def source_lines(q):\n    txt=Path(q['path']).read_text(encoding='utf-8')\n    out=[]\n    for line in txt.splitlines():\n        z=line.strip()\n        if not z or z.startswith('## '):\n            continue\n        if z.startswith('# '):\n            z=re.sub(r'^#\\s+Q\\d+\\.\\s*','',z)\n        elif z.startswith('### '):\n            z=z[4:]\n            z=re.sub(r'^Q\\d+[a-z]?\\.\\s*','',z,flags=re.I)\n        z=re.sub(r'^\\d+\\.\\s*','',z)\n        z=re.sub(r'^[-•]\\s*','',z)\n        z=plain_md(z)\n        if len(z)>=2:\n            out.append(z)\n    return out\n\ndef question_pdf_text(pdf,q,start_body,end_body,body_offset):\n    parts=[]\n    for bp in range(start_body,end_body+1):\n        p=pdf[body_offset+bp-1]\n        for line in p.get_text('text').splitlines():\n            z=line.strip()\n            if not z or z==BOOK_TITLE or re.fullmatch(r'Q\\d+',z) or re.fullmatch(r'\\d+',z):\n                continue\n            parts.append(z)\n    return norm(' '.join(parts))\n\ndef qa(final,qs,starts,body_offset):\n    pdf=fitz.open(final)\n    missing=[]; total=0\n    for q in qs:\n        st=starts[q['q']]\n        e=starts.get(q['q']+1, pdf.page_count-body_offset+1)-1\n        actual=question_pdf_text(pdf,q['q'],st,e,body_offset)\n        for src in source_lines(q):\n            total+=1\n            if norm(src) not in actual:\n                missing.append({'q':q['q'],'line':src[:260]})\n    oob=[]; repl=[]\n    for pi,page in enumerate(pdf,1):\n        for b in page.get_text('dict').get('blocks',[]):\n            for l in b.get('lines',[]):\n                for sp in l.get('spans',[]):\n                    x0,y0,x1,y1=sp['bbox']; txt=sp.get('text','')\n                    if x0 < -1 or y0 < -1 or x1 > PAGE_W+1 or y1 > PAGE_H+1:\n                        oob.append((pi,txt[:60],sp['bbox']))\n                    if '\\ufffd' in txt:\n                        repl.append((pi,txt))\n    start_errors=[]\n    for q in qs:\n        phys=body_offset+starts[q['q']]-1\n        t=pdf[phys].get_text('text')\n        if f'ΕΡΩΤΗΣΗ {q[\"q\"]}' not in t or q['title'][:25] not in t:\n            start_errors.append(q['q'])\n    fonts={}\n    for page in pdf:\n        for f in page.get_fonts(full=True): fonts[f[3]]=f\n    report={'source_commit':SOURCE_COMMIT,'questions':len(qs),'physical_pages':pdf.page_count,'body_pages':pdf.page_count-body_offset,\n      'body_offset_physical_pages':body_offset,'question_start_pages_body':starts,'source_lines_total':total,'source_lines_missing':len(missing),'missing_examples':missing[:25],\n      'out_of_bounds':len(oob),'replacement_glyphs':len(repl),'question_start_errors':start_errors,'fonts':sorted(fonts.keys()),'base14_fonts':[n for n in sorted(fonts.keys()) if n in {'Helvetica','Times-Roman','Courier','Symbol','ZapfDingbats'}]}\n    return report\n\n'''
          s=s[:start]+qa_block+s[end:]
          s=s.replace("    report=qa(final,QUESTIONS,starts,body_offset)\n", "    removed_f1_resources=remove_unused_base14_f1(final)\n    report=qa(final,QUESTIONS,starts,body_offset)\n    report['unused_f1_resources_removed']=removed_f1_resources\n", 1)
          s=s.replace("if report['source_chunks_missing'] or report['out_of_bounds']", "if report['source_lines_missing'] or report['out_of_bounds']", 1)
          p.write_text(s,'utf-8')
          print('MASTER_SHA256',__import__('hashlib').sha256(p.read_bytes()).hexdigest())
          PY
          python -m py_compile /tmp/Greek_publication_master_v3.py

      - name: Verify frozen corpus
        run: |
          test "$(find source/oral/100-crucial-questions/answers/revision-v3-el -maxdepth 1 -type f -name 'Q???.md' | wc -l)" -eq 100
          python - <<'PY'
          from pathlib import Path
          root=Path('source/oral/100-crucial-questions/answers/revision-v3-el')
          names=sorted(p.name for p in root.glob('Q???.md'))
          assert names==[f'Q{i:03d}.md' for i in range(1,101)]
          print('CORPUS_OK 100/100')
          PY

      - name: Build Greek v3 A4 book
        working-directory: source
        env:
          GREEK_SRC: oral/100-crucial-questions/answers/revision-v3-el
          GREEK_OUT: ../output
          SOURCE_COMMIT: 63a844d881072d13fd6e33423b9e01fb8f91f0d9
        run: python /tmp/Greek_publication_master_v3.py | tee ../build.log

      - name: Technical PDF checks
        run: |
          set -e
          PDF=output/The_100_Crucial_Questions_in_Psychiatry_v3_GREEK_COMPLETE_A4.pdf
          test -f "$PDF"
          cp /tmp/Greek_publication_master_v3.py output/Greek_publication_master_v3.py
          pdfinfo "$PDF" > output/pdfinfo.txt
          pdffonts "$PDF" > output/pdffonts.txt
          ! grep -E 'Helvetica|Times-Roman|Courier|ZapfDingbats' output/pdffonts.txt
          tar -czf output/greek_v3_sources_frozen.tgz -C source oral/100-crucial-questions/answers/revision-v3-el
          git -C source ls-tree -r 63a844d881072d13fd6e33423b9e01fb8f91f0d9 -- oral/100-crucial-questions/answers/revision-v3-el > output/source_tree.txt
          cp build.log output/build.log
          sha256sum "$PDF" output/Greek_publication_master_v3.py

      - name: Upload Greek v3 publication artifact
        uses: actions/upload-artifact@v4
        with:
          name: greek-v3-publication-candidate
          if-no-files-found: error
          path: |
            output/The_100_Crucial_Questions_in_Psychiatry_v3_GREEK_COMPLETE_A4.pdf
            output/Greek_publication_master_v3.py
            output/GREEK_COMPLETE_book_manifest.json
            output/GREEK_COMPLETE_QA_report.json
            output/pdfinfo.txt
            output/pdffonts.txt
            output/build.log
            output/greek_v3_sources_frozen.tgz
            output/source_tree.txt
