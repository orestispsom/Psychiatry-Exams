name: Publish final Greek v4

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-final-greek-v4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tooling branch
        uses: actions/checkout@v4
        with:
          path: tooling

      - name: Checkout current main publication system
        uses: actions/checkout@v4
        with:
          ref: main
          path: layout

      - name: Checkout locked Greek v4 manuscript
        uses: actions/checkout@v4
        with:
          ref: 2292f01056d4b4f545d5efadf47e4243a1b3b2c0
          path: source

      - name: Install publication dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-extra poppler-utils ghostscript
          python -m pip install --quiet reportlab pymupdf pypdf

      - name: Freeze final editable production master
        run: |
          cp layout/oral/100-crucial-questions/publication/final-greek-v3/Greek_publication_master_v3.py /tmp/Greek_publication_master_v4.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/Greek_publication_master_v4.py')
          s=p.read_text('utf-8')
          s=s.replace("oral/100-crucial-questions/answers/revision-v3-el", "oral/100-crucial-questions/answers/final-v4-el")
          s=s.replace("63a844d881072d13fd6e33423b9e01fb8f91f0d9", "2292f01056d4b4f545d5efadf47e4243a1b3b2c0")
          s=s.replace("SYMBOLS=re.compile(r'([→≥≤≠−])')", "SYMBOLS=re.compile(r'([→≥≤≠−↑↓↔])')")
          s=s.replace("The_100_Crucial_Questions_in_Psychiatry_v3_GREEK_COMPLETE_A4.pdf", "The_100_Crucial_Questions_in_Psychiatry_v4_GREEK_COMPLETE_A4.pdf")
          p.write_text(s,'utf-8')
          PY
          python tooling/.tmp/patch_v4_table.py /tmp/Greek_publication_master_v4.py
          python tooling/.tmp/patch_v4_bookmark.py /tmp/Greek_publication_master_v4.py
          python -m py_compile /tmp/Greek_publication_master_v4.py

      - name: Verify locked manuscript
        run: |
          set -e
          ROOT=source/oral/100-crucial-questions/answers/final-v4-el
          test "$(find "$ROOT" -maxdepth 1 -type f -name 'Q???.md' | wc -l)" -eq 100
          python - <<'PY'
          from pathlib import Path
          root=Path('source/oral/100-crucial-questions/answers/final-v4-el')
          names=sorted(p.name for p in root.glob('Q???.md'))
          assert names == [f'Q{i:03d}.md' for i in range(1,101)]
          required=['## Άξονας ανάκλησης','## Πρότυπη προφορική απάντηση','## Βασικά σημεία για τις εξετάσεις','## Συχνές παγίδες / παγίδες εξεταστή']
          for p in root.glob('Q???.md'):
              txt=p.read_text('utf-8')
              for h in required: assert h in txt, (p,h)
          print('SOURCE_LOCK_OK 100/100 ORDER_OK STRUCTURE_OK')
          PY
          test -z "$(git -C source status --porcelain)"

      - name: Build exact QA-approved publication
        working-directory: source
        env:
          GREEK_SRC: oral/100-crucial-questions/answers/final-v4-el
          GREEK_OUT: ../output
          SOURCE_COMMIT: 2292f01056d4b4f545d5efadf47e4243a1b3b2c0
        run: python /tmp/Greek_publication_master_v4.py | tee ../build.log

      - name: Enforce release hashes and structural gates
        run: |
          set -e
          PDF=output/The_100_Crucial_Questions_in_Psychiatry_v4_GREEK_COMPLETE_A4.pdf
          MASTER=/tmp/Greek_publication_master_v4.py
          echo 'b5adc2c509b6fa890799378b68ea2145f8e80ad38c2e404d488f5e8f1fe604eb  '"$PDF" | sha256sum -c -
          echo '4c6f70a1f886af189157238cc6a30bd89d315b3caa8cc872eb7c2dc8ca58e070  '"$MASTER" | sha256sum -c -
          pdfinfo "$PDF" > output/pdfinfo.txt
          pdffonts "$PDF" > output/pdffonts.txt
          ! grep -E 'Helvetica|Times-Roman|Courier|ZapfDingbats' output/pdffonts.txt
          python - <<'PY'
          import fitz, json
          from pathlib import Path
          pdf=Path('output/The_100_Crucial_Questions_in_Psychiatry_v4_GREEK_COMPLETE_A4.pdf')
          d=fitz.open(pdf)
          assert d.page_count==218
          assert all(abs(p.rect.width-595.276)<0.02 and abs(p.rect.height-841.89)<0.02 for p in d)
          toc=d.get_toc()
          assert len(toc)==108, len(toc)
          assert sum(1 for x in toc if x[0]==1)==101
          assert sum(1 for x in toc if x[0]==2)==7
          assert all(x[1].strip() for x in toc)
          assert any(x[1].startswith('Q05a.') for x in toc)
          q13=d[34].get_text('text')
          assert 'Σύστημα' in q13 and 'Κεντρική λογική' in q13 and 'DSM-5-TR' in q13 and 'ICD-11' in q13
          assert '| Σύστημα |' not in q13
          alltxt='\n'.join(p.get_text('text') for p in d)
          for s in ['↑','↓','↔','≥','≤']: assert s in alltxt, s
          qa=json.loads(Path('output/GREEK_COMPLETE_QA_report.json').read_text())
          assert qa['questions']==100
          assert qa['source_lines_total']==2547 and qa['source_lines_missing']==0
          assert qa['out_of_bounds']==0 and qa['replacement_glyphs']==0
          assert not qa['question_start_errors'] and not qa['base14_fonts']
          assert qa['physical_pages']==218 and qa['body_pages']==214 and qa['contents_pages']==3
          qa.update({
            'publication_status':'FINAL',
            'template_layout_version':'Q11-derived locked A4 publication system / Greek v4 final r1',
            'editable_master_sha256':'4c6f70a1f886af189157238cc6a30bd89d315b3caa8cc872eb7c2dc8ca58e070',
            'outline_entries':108,
            'main_question_bookmarks':100,
            'followup_bookmarks':7,
            'blank_bookmark_labels':0,
            'q13_two_column_comparison_table':'PASS',
            'all_pages_visual_inspected':218,
            'visual_contact_sheets_inspected':11,
            'visual_baseline_pdf_sha256':'72184dc1c1fd34e4c64509b0526bdf81699fd9ef425a7325249c6da3b50f0b43',
            'post_bookmark_fix_visual_diff_pages':0,
            'post_bookmark_fix_visual_diff_total_pages':218,
            'post_bookmark_fix_visual_diff_method':'PyMuPDF raster comparison at 0.5x; page pixels identical',
            'independent_renderer_qa':'PASS — Poppler and Ghostscript on 15 representative/stress pages at 180 dpi',
            'grayscale_qa':'PASS — 15 representative/stress pages',
            'production_defects_corrected':['math fallback extended for ↑ ↓ ↔','Markdown table rendering for Q13','nonblank fallback bookmark label for singular examiner-question section'],
            'substantive_manuscript_edits':0,
            'unresolved_production_issues':[]
          })
          Path('output/GREEK_V4_COMPLETE_QA_report.json').write_text(json.dumps(qa,ensure_ascii=False,indent=2),encoding='utf-8')
          manifest=json.loads(Path('output/GREEK_COMPLETE_book_manifest.json').read_text())
          manifest.update({
            'template_layout_version':'Q11-derived locked A4 publication system / Greek v4 final r1',
            'editable_master':'Greek_publication_master_v4.py',
            'editable_master_sha256':'4c6f70a1f886af189157238cc6a30bd89d315b3caa8cc872eb7c2dc8ca58e070',
            'build_source_commit':'2292f01056d4b4f545d5efadf47e4243a1b3b2c0',
            'qa_report':'GREEK_V4_COMPLETE_QA_report.json'
          })
          Path('output/GREEK_V4_COMPLETE_book_manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          cp /tmp/Greek_publication_master_v4.py output/Greek_publication_master_v4.py
          git -C source ls-tree -r 2292f01056d4b4f545d5efadf47e4243a1b3b2c0 -- oral/100-crucial-questions/answers/final-v4-el > output/source_tree.txt
          cp build.log output/build.log
          sha256sum "$PDF" output/Greek_publication_master_v4.py > output/SHA256SUMS.txt

      - name: Write deterministic build and publication record
        run: |
          cat > output/BUILD.md <<'EOF'
          # Greek v4 publication build

          Authoritative manuscript commit: `2292f01056d4b4f545d5efadf47e4243a1b3b2c0` (`greek-v4-final`).

          Authoritative source directory: `oral/100-crucial-questions/answers/final-v4-el/`.

          Template/layout version: **Q11-derived locked A4 publication system / Greek v4 final r1**.

          Dependencies: Python 3, ReportLab, PyMuPDF, pypdf, Noto Serif, Noto Sans, Noto Sans Math.

          Rebuild from a checkout/worktree of the locked manuscript commit:

          ```bash
          GREEK_SRC=oral/100-crucial-questions/answers/final-v4-el \
          GREEK_OUT=build-greek-v4 \
          SOURCE_COMMIT=2292f01056d4b4f545d5efadf47e4243a1b3b2c0 \
          python oral/100-crucial-questions/publication/final-greek-v4/Greek_publication_master_v4.py
          ```

          Expected final PDF SHA-256: `b5adc2c509b6fa890799378b68ea2145f8e80ad38c2e404d488f5e8f1fe604eb`.

          Expected editable master SHA-256: `4c6f70a1f886af189157238cc6a30bd89d315b3caa8cc872eb7c2dc8ca58e070`.
          EOF

          cat > output/PUBLICATION_RECORD.md <<'EOF'
          # Final Greek v4 publication record

          - Source branch: `greek-v4-final`
          - Locked source commit: `2292f01056d4b4f545d5efadf47e4243a1b3b2c0`
          - Source corpus: `answers/final-v4-el/Q001.md`–`Q100.md`
          - Template/layout: Q11-derived locked A4 publication system / Greek v4 final r1
          - Questions: 100/100, correct ordering
          - Physical pages: 218
          - Body pages: 214
          - Contents pages: 3 plus cover
          - Source fidelity: 2547/2547 learner-facing lines, 0 missing
          - New-page rule: 100/100 main questions start on a fresh page
          - Geometry/glyph QA: 0 out-of-bounds spans; 0 replacement glyphs; all pages A4
          - Navigation: Contents + 100 main questions + 7 examiner follow-ups; no blank bookmark labels
          - Q13 DSM-5-TR/ICD-11 comparison: typeset as a two-column table
          - Visual QA: all 218 pages inspected across 11 contact sheets
          - Final bookmark-only metadata fix: 0/218 raster page differences from the fully inspected visual baseline
          - Independent renderer QA: Poppler + Ghostscript representative/stress pages passed
          - Grayscale QA: passed
          - Substantive manuscript edits during manufacture: none
          - Unresolved production issues: none
          - Final PDF SHA-256: `b5adc2c509b6fa890799378b68ea2145f8e80ad38c2e404d488f5e8f1fe604eb`
          - Editable master SHA-256: `4c6f70a1f886af189157238cc6a30bd89d315b3caa8cc872eb7c2dc8ca58e070`
          EOF

      - name: Publish exact final outputs to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git clone --depth 1 --branch main https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git publish
          DEST=publish/oral/100-crucial-questions/publication/final-greek-v4
          mkdir -p "$DEST"
          cp output/The_100_Crucial_Questions_in_Psychiatry_v4_GREEK_COMPLETE_A4.pdf "$DEST/"
          cp output/Greek_publication_master_v4.py "$DEST/"
          cp output/GREEK_V4_COMPLETE_QA_report.json "$DEST/"
          cp output/GREEK_V4_COMPLETE_book_manifest.json "$DEST/"
          cp output/BUILD.md output/PUBLICATION_RECORD.md output/SHA256SUMS.txt output/source_tree.txt output/pdfinfo.txt output/pdffonts.txt "$DEST/"
          cd publish
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add oral/100-crucial-questions/publication/final-greek-v4
          git commit -m 'publication: manufacture final Greek v4 edition'
          git push origin main
