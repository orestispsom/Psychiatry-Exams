      - maternal/infant risk and admission considerations
      - continuity across pregnancy/postpartum and family/support involvement

  Q28:
    must_cover:
      - panic-attack phenomenology and panic disorder/agoraphobia distinction
      - medical and substance differential
      - CBT/exposure and pharmacological treatment

  Q29:
    must_cover:
      - pervasive worry and associated symptoms
      - depression, OCD, trauma, substance and medical differentials
      - psychological and pharmacological treatment

  Q30:
    must_cover:
