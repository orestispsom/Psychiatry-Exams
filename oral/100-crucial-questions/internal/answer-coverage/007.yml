schema_version: 1
attempt: "007"
visible_questions: ../../attempts/007.md
canonical_coverage: ../core-coverage.yml
question_map: ../attempt-maps/007.yml
status: provisional

purpose: >-
  Hidden authoring specification for Attempt 007. It defines the minimum territory an excellent
  answer to each visible question should cover. It is downstream of core-coverage.yml and must
  never redefine the canonical psychiatry knowledge bank. It should remain concise: enough to
  prevent important omissions, not an outline of every fact that may appear in the final answer.

rules:
  - Use only clinically or examination-relevant coverage.
  - Do not turn these items into visible subquestions unless they pass the genuine-follow-up test.
  - Exact doses, thresholds, monitoring intervals, current legal rules and licensing details must be verified when answers are written.
  - Distributed coverage is intentional: an IMPORTANT canonical topic may be protected across several answers rather than given a separate main question.

questions:
  Q1:
    must_cover:
      - systematic history, collateral information, MSE, risk, formulation and initial plan
      - thought form/content, perception, mood/affect, psychomotor state, cognition, insight and judgement within the MSE
      - relevant physical/neurological assessment and functional/social context

  Q2:
    must_cover:
      - delusion, overvalued idea, obsession and rumination
      - conviction, insight, resistance, intrusiveness and relation to behaviour
      - clinically important overlap and imperfect boundaries

  Q3:
    must_cover:
      - red flags for medical, neurological, medication and substance causes
      - physical/neurological examination and collateral timeline
      - rational use of laboratory tests, toxicology, EEG, imaging and CSF when indicated

  Q4:
    must_cover:
      - ideation, intent, plan, means, preparation, previous behaviour and current mental state
      - dynamic, historical and protective factors
      - formulation, immediate safety, supervision and disposition rather than categorical prediction

  Q5:
    must_cover:
      - post-attempt reassessment and treatment of the underlying disorder
      - safety planning, means-safety, continuity and rapid follow-up
      - psychosocial interventions and treatments with evidence relevant to suicide reduction
      - family/support involvement when appropriate

  Q6:
    must_cover:
      - acute and longer-term violence-risk formulation
      - historical, clinical, substance-related, personality, neurological and situational contributors
      - structured tools as adjuncts rather than replacements for judgement
      - immediate risk-management plan
    candidate_coverage:
      - intimate-partner/domestic violence recognition and safety implications

  Q7:
    must_cover:
      - immediate environmental safety and verbal de-escalation
      - indications and principles of rapid tranquillisation with monitoring
      - restrictive interventions as last resort
      - delirium, intoxication/withdrawal and medical/neurological causes that must not be missed

  Q8:
    must_cover:
      - decision- and time-specific capacity assessment
      - understanding, appreciation, reasoning and communication of choice
      - distinction from diagnosis, insight, disagreement and legal competence
      - implications of incapacity for consent/refusal and surrogate processes

  Q9:
    must_cover:
      - current Greek legal criteria and process
      - necessity, proportionality and least-restrictive care
      - documentation, rights and safeguards
    verification_required: current_official_Greek_law

  Q10:
    must_cover:
      - syndromic recognition and principal signs of catatonia
      - psychiatric, neurological, toxic and medical differential
      - benzodiazepine treatment and ECT
      - malignant catatonia and distinction from NMS

  Q11:
    must_cover:
      - psychopathology, risk, collateral history and functional decline
      - affective, substance-related and secondary medical/neurological differentials
      - initial investigations and admission decisions
      - initial antipsychotic, engagement and early psychosocial intervention

  Q12:
    must_cover:
      - positive, negative, disorganised, cognitive and affective dimensions
      - formal thought disorder and perceptual abnormalities relevant to schizophrenia
      - diagnostic framework and longitudinal requirements
      - contemporary significance and limitations of historical first-rank symptoms

  Q13:
    must_cover:
      - temporal relationship between mood episodes and psychosis
      - schizoaffective disorder versus schizophrenia versus psychotic mood disorder
      - brief/delusional/substance-induced psychoses as necessary adjacent differentials

  Q14:
    must_cover:
      - neurodevelopmental and genetic liability
      - dopamine and glutamate hypotheses
      - environmental risk and gene-environment interaction
      - limits of current biomarkers, imaging and single-mechanism explanations

  Q15:
    must_cover:
      - heterogeneous course and functional outcome
      - duration of untreated psychosis
      - negative/cognitive symptoms, substance use, social support and premorbid function
      - suicide and excess physical-health mortality

  Q16:
    must_cover:
      - antipsychotic selection and adequate trial principles
      - agitation/risk and comorbidity management
      - early psychosocial care and adherence
      - recognition of non-response and adverse effects

  Q17:
    must_cover:
      - maintenance antipsychotic treatment, adherence and LAIs
      - relapse prevention and physical-health monitoring
      - family intervention, psychoeducation, CBT for psychosis and rehabilitation
      - primary versus secondary negative symptoms and cognitive-functional impairment

  Q18:
    must_cover:
      - definition of adequate prior antipsychotic trials
      - pseudo-resistance: adherence, substances, diagnosis and pharmacokinetic issues
      - indication for clozapine
      - approach to incomplete clozapine response

  Q19:
    must_cover:
      - indications and expected benefits of clozapine
      - initiation, interruption/re-titration and blood monitoring
      - neutropenia, myocarditis, seizures, severe GI hypomotility and metabolic effects
      - smoking/CYP1A2, infection and plasma-level implications
      - hypersalivation and other clinically important tolerability problems

  Q20:
    must_cover:
      - core depressive syndrome, severity and functional impairment
      - bipolar, medical, neurological, medication and substance differentials
      - melancholic, atypical, psychotic, catatonic, seasonal and persistent/recurrent patterns
      - suicide risk

  Q21:
    must_cover:
      - treatment selection by severity, psychosis, suicidality, prior response and preference
      - psychotherapy, antidepressants and combined treatment
      - indications for ECT or other specialist treatment
      - continuation treatment and early monitoring

  Q22:
    must_cover:
      - confirmation of diagnosis and exclusion of pseudo-resistance
      - adequacy of dose, duration and adherence
      - switching, combination and augmentation strategies
      - lithium, atypical antipsychotics, ECT and ketamine/esketamine in appropriate contexts

  Q23:
    must_cover:
      - bipolar I, bipolar II, hypomania and cyclothymic presentations
      - bipolar versus unipolar depression
      - distinction from ADHD, BPD, substances and secondary mania
      - longitudinal course and episodicity

  Q24:
    must_cover:
      - syndrome recognition and secondary causes
      - risk, capacity and admission
      - acute pharmacological management
      - medical, substance and medication-induced mania

  Q25:
    must_cover:
      - evidence-based acute treatment options
      - role and limitations of antidepressants
      - mixed features, switch risk and suicidality

  Q26:
    must_cover:
      - maintenance treatment selection based on polarity and prior response
      - lithium, valproate, lamotrigine and clinically relevant alternatives including carbamazepine
      - rapid cycling/mixed features
      - psychoeducation, adherence and physical-health monitoring

  Q27:
    must_cover:
