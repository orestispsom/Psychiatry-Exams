    priority: CORE
    label: Core clinical pharmacokinetic and pharmacodynamic principles
    essentials:
      - half-life and steady state
      - therapeutic index and therapeutic drug monitoring
      - CYP inhibition/induction and smoking
      - renal/hepatic impairment and age
      - clinically important interaction and polypharmacy principles

  - id: psychopharm.antipsychotic_selection
    domain: psychopharmacology
    priority: CORE
    label: Antipsychotic selection
    essentials:
      - efficacy and previous response
      - adverse-effect profile and comorbidity
      - adherence, formulation and long-acting injectables
      - patient preference and monitoring burden

  - id: psychopharm.antipsychotic_eps
    domain: psychopharmacology
    priority: CORE
    label: Antipsychotic-induced extrapyramidal syndromes
    essentials:
      - acute dystonia
      - drug-induced parkinsonism
      - akathisia
      - tardive dyskinesia
      - prevention and treatment principles

  - id: psychopharm.antipsychotic_metabolic_endocrine_cv
    domain: psychopharmacology
    priority: CORE
    label: Major non-neurological antipsychotic adverse effects
    essentials:
      - weight gain and metabolic syndrome
      - hyperprolactinaemia
      - QT/cardiovascular effects
      - monitoring and drug-switch decisions

  - id: psychopharm.clozapine
    domain: psychopharmacology
    priority: CORE
    label: Clozapine
    essentials:
      - indications in treatment-resistant schizophrenia and suicide/aggression where relevant
      - initiation, interruption and re-titration
      - blood monitoring and neutropenia
      - myocarditis, seizures and severe gastrointestinal hypomotility
      - metabolic burden and hypersalivation
      - smoking/CYP1A2, infection and plasma-level implications

  - id: psychopharm.antidepressant_selection
    domain: psychopharmacology
    priority: CORE
    label: Antidepressant selection
    essentials:
