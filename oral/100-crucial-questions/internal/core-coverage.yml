schema_version: 1
updated: 2026-08-18
status: living

purpose: >-
  Canonical question-independent coverage map for The 100 Crucial Questions in Psychiatry.
  It defines the clinically and examination-relevant psychiatry knowledge that a well-prepared
  senior psychiatry resident should possess. Visible question attempts must map to this file;
  this file must not be shaped around any particular attempt or question numbering.

inclusion_rule: >-
  Include a coverage unit when failure to know it would represent a meaningful gap in the
  knowledge, reasoning or safe practice expected of a well-prepared senior psychiatry resident.
  Prefer clinically consequential, diagnostically discriminative, treatment-relevant and
  recurrent examination material. Do not expand into exhaustive textbook detail.

priority_levels:
  CORE: Must be strongly represented in the final guide.
  IMPORTANT: Should be represented somewhere, but may sit within another answer or a genuine follow-up.
  SUPPORTING: Valuable senior-resident knowledge that should not displace CORE material.

maintenance_rules:
  - Coverage units use stable IDs and must not contain attempt question numbers.
  - Enrich units when new sources expose a meaningful gap; do not add trivia merely because a source mentions it.
  - Essentials are minimum knowledge expectations, not model-answer outlines.
  - Exact doses, thresholds, monitoring intervals, legal rules and current guideline details belong in verified answer work, not here unless the concept itself is crucial.
  - A single coverage unit may map to several questions, and one question may map to several coverage units.
  - Question wording, follow-up design and attempt-specific decisions belong outside this file.

coverage:
  # ---------------------------------------------------------------------------
  # ASSESSMENT, PSYCHOPATHOLOGY, RISK, LAW, EMERGENCIES
  # ---------------------------------------------------------------------------
  - id: assessment.comprehensive
    domain: assessment
    priority: CORE
    label: Comprehensive psychiatric assessment and formulation
    essentials:
      - psychiatric history, collateral information and relevant physical/neurological assessment
      - mental state examination
      - risk assessment
      - differential diagnosis and biopsychosocial formulation
      - investigation and initial management planning

  - id: psychopathology.thought_content
    domain: psychopathology
    priority: CORE
    label: Abnormal beliefs and intrusive thoughts
    essentials:
      - delusion
      - overvalued idea
      - obsession and rumination
      - clinically useful distinctions in conviction, insight, resistance and meaning

  - id: psychopathology.thought_form
    domain: psychopathology
    priority: IMPORTANT
    label: Thought form, stream and possession
    essentials:
      - disorganisation and formal thought disorder
      - flight of ideas, circumstantiality, tangentiality and thought blocking
      - thought interference and passivity phenomena

  - id: psychopathology.perception
    domain: psychopathology
    priority: IMPORTANT
    label: Perceptual abnormalities
    essentials:
      - hallucination versus illusion and other non-psychotic perceptual phenomena
      - modality and phenomenology
      - features suggesting neurological, toxic or delirious rather than primary psychotic causes

  - id: psychopathology.mood_affect_psychomotor
    domain: psychopathology
    priority: IMPORTANT
    label: Mood, affect and psychomotor abnormalities
    essentials:
      - subjective mood versus observed affect
      - reactivity, congruence, range and lability
      - psychomotor retardation, agitation and clinically important motor phenomena

  - id: psychopathology.cognition_insight
    domain: psychopathology
    priority: IMPORTANT
    label: Cognition, insight and judgement in psychiatric assessment
    essentials:
      - attention, orientation, memory and executive function at the bedside
      - multidimensional nature of insight
      - relevance to diagnosis, risk, adherence and capacity without conflating these constructs

  - id: assessment.secondary_causes
    domain: assessment
    priority: CORE
    label: Secondary medical, neurological, medication-related and substance-related psychiatric presentations
    essentials:
      - red flags for an organic or toxic cause
      - appropriate physical and neurological examination
      - rational use of laboratory tests, toxicology, EEG, neuroimaging and CSF studies
      - avoidance of diagnostic overshadowing

  - id: risk.suicide_assessment
    domain: risk
    priority: CORE
    label: Suicide and self-harm risk assessment
    essentials:
      - ideation, intent, plan, means, preparation and previous behaviour
      - dynamic, historical and protective factors
      - formulation rather than simple categorical prediction
      - immediate safety and disposition planning

  - id: suicide.clinical_topic
    domain: risk
    priority: CORE
    label: Suicide as a major psychiatric clinical topic
    essentials:
      - major epidemiological and disorder-related patterns
      - established risk and protective factors
      - prevention and means-safety principles
      - post-attempt management and continuity of care
      - treatments with particular relevance to suicide reduction where evidence supports this

  - id: risk.violence
    domain: risk
    priority: CORE
    label: Violence and serious aggression risk assessment
    essentials:
      - acute versus longer-term risk formulation
      - historical, clinical and situational contributors
      - substance use, psychosis, personality pathology and neurological causes
      - structured tools as adjuncts rather than substitutes for clinical formulation

  - id: emergency.agitation
    domain: emergencies
    priority: CORE
    label: Acute agitation and behavioural emergency management
    essentials:
      - safety and verbal de-escalation
      - rapid tranquillisation principles and monitoring
      - restrictive interventions as last resort
      - exclusion of medical, neurological, toxic and withdrawal causes

  - id: emergency.catatonia
    domain: emergencies
    priority: CORE
    label: Catatonia
    essentials:
      - characteristic clinical signs and syndromic recognition
      - psychiatric and medical differential diagnosis
      - benzodiazepine treatment and ECT
      - malignant catatonia and distinction from NMS

  - id: legal.capacity_consent
    domain: legal_ethics
    priority: CORE
    label: Treatment decision-making capacity and consent
    essentials:
      - decision-specific and time-specific assessment
      - relationship between understanding, appreciation, reasoning and communication of choice
      - distinction from diagnosis, disagreement and legal competence
      - implications for treatment refusal and surrogate processes

  - id: legal.involuntary_greece
    domain: legal_ethics
    priority: CORE
    label: Involuntary psychiatric assessment and treatment in Greece
    essentials:
      - current legal criteria and procedural safeguards
      - clinical assessment of necessity and proportionality
      - documentation, rights and least-restrictive practice
    note: Current Greek law must be verified from official sources when model answers are written.

  # ---------------------------------------------------------------------------
  # PSYCHOTIC DISORDERS
  # ---------------------------------------------------------------------------
  - id: psychosis.first_episode
    domain: psychosis
    priority: CORE
    label: First-episode psychosis
    essentials:
      - differential diagnosis including affective, substance-related and medical causes
      - risk, collateral information, physical examination and investigations
      - initial antipsychotic and psychosocial treatment
      - admission decisions, engagement and early-intervention principles

  - id: schizophrenia.syndrome_diagnosis
    domain: psychosis
    priority: CORE
    label: Schizophrenia syndrome and diagnosis
    essentials:
      - positive, negative, disorganised, cognitive and affective dimensions
      - diagnostic framework and longitudinal requirements
      - characteristic phenomenology including historical first-rank symptoms without over-weighting them

  - id: schizophrenia.differential
    domain: psychosis
    priority: CORE
    label: Differential diagnosis of schizophrenia-spectrum psychosis
    essentials:
      - schizoaffective disorder
      - mood disorders with psychotic features
      - brief and delusional disorders
      - substance-induced and secondary psychoses

  - id: schizophrenia.aetiology_pathophysiology
    domain: psychosis
    priority: IMPORTANT
    label: Aetiology and pathophysiology of schizophrenia
    essentials:
      - genetic and neurodevelopmental liability
      - environmental risk and gene-environment interaction
      - dopamine and glutamate models
      - limits of neuroimaging and biomarker findings in individual diagnosis

  - id: schizophrenia.course_prognosis
    domain: psychosis
    priority: IMPORTANT
    label: Course and prognosis of schizophrenia
    essentials:
      - heterogeneous longitudinal course and functional outcome
      - duration of untreated psychosis
      - prognostic relevance of onset, sex, cognition, negative symptoms, substance use and support
      - suicide and excess physical-health mortality

  - id: schizophrenia.acute_treatment
    domain: psychosis
    priority: CORE
    label: Acute treatment of schizophrenia
    essentials:
      - antipsychotic selection and adequate trial
      - management of agitation, risk and comorbidity
      - early psychosocial work and engagement
      - recognition of non-response and adverse effects

  - id: schizophrenia.maintenance_rehabilitation
    domain: psychosis
    priority: CORE
    label: Maintenance treatment and rehabilitation in schizophrenia
    essentials:
      - relapse prevention and maintenance antipsychotic treatment
      - adherence and long-acting injectable formulations
      - family intervention, CBT for psychosis and psychoeducation where indicated
      - social, occupational and physical-health rehabilitation

  - id: schizophrenia.trs
    domain: psychosis
    priority: CORE
    label: Treatment-resistant schizophrenia
    essentials:
      - adequate prior treatment trials
      - pseudo-resistance including adherence and substance use
      - indication for clozapine
      - approach to incomplete clozapine response

  - id: schizophrenia.negative_cognitive
    domain: psychosis
    priority: IMPORTANT
    label: Negative symptoms and cognitive impairment in schizophrenia
    essentials:
      - primary versus secondary negative symptoms
      - major cognitive domains and functional relevance
      - treatment limitations and psychosocial rehabilitation

  - id: psychosis.early_detection
    domain: psychosis
    priority: SUPPORTING
    label: Clinical high-risk states and early intervention in psychosis
    essentials:
      - risk-state concepts and limitations of prediction
      - avoiding premature labelling
      - monitoring, psychosocial intervention and management of comorbidity

  # ---------------------------------------------------------------------------
  # MOOD AND REPRODUCTIVE PSYCHIATRY
  # ---------------------------------------------------------------------------
  - id: depression.mdd
    domain: mood
    priority: CORE
    label: Major depressive disorder
    essentials:
      - characteristic syndrome and diagnostic framework
      - severity, psychotic features and functional impairment
      - bipolar, medical, neurological, medication and substance differentials
      - suicide assessment

  - id: depression.patterns_specifiers
    domain: mood
    priority: IMPORTANT
    label: Clinically important depressive patterns and specifiers
    essentials:
      - melancholic and atypical presentations
      - psychotic and catatonic depression
      - seasonal pattern and persistent/recurrent illness

  - id: depression.acute_treatment
    domain: mood
    priority: CORE
    label: Acute treatment of major depression
    essentials:
      - treatment selection according to severity, risk, prior response and preference
      - psychotherapy, antidepressants and combined treatment
      - indications for ECT and other specialist interventions
      - continuation treatment and early monitoring

  - id: depression.trd
    domain: mood
    priority: CORE
    label: Treatment-resistant depression
    essentials:
      - confirmation of diagnosis and pseudo-resistance
      - adequate dose, duration and adherence
      - switching, combination and augmentation strategies
      - lithium, atypical antipsychotic augmentation, ECT and ketamine/esketamine in appropriate contexts

  - id: bipolar.diagnosis
    domain: mood
    priority: CORE
    label: Bipolar disorder diagnosis and differential
    essentials:
      - bipolar I, bipolar II and cyclothymic presentations
      - mania versus hypomania
      - bipolar versus unipolar depression
      - distinction from ADHD, BPD, substances and secondary mania

  - id: bipolar.mania
    domain: mood
    priority: CORE
    label: Acute mania
    essentials:
      - syndrome recognition and differential diagnosis
      - risk, capacity and admission
      - acute pharmacological management
      - secondary medical, medication and substance causes

  - id: bipolar.depression
    domain: mood
    priority: CORE
    label: Bipolar depression
    essentials:
      - evidence-based acute treatment choices
      - role and limitations of antidepressants
      - mixed features, switch risk and suicide risk

  - id: bipolar.maintenance
    domain: mood
    priority: CORE
    label: Bipolar maintenance treatment
    essentials:
      - relapse-prevention treatment selection
      - polarity-specific previous response
      - mixed features and rapid cycling
      - psychoeducation, adherence and physical-health monitoring

  - id: reproductive.perinatal
    domain: reproductive
    priority: CORE
    label: Perinatal psychiatry
    essentials:
      - psychiatric illness during pregnancy
      - postpartum depression and postpartum psychosis
      - maternal and infant risk
      - balancing untreated-illness risk against treatment risk
      - breastfeeding and continuity of care

  - id: reproductive.pmdd
    domain: reproductive
    priority: IMPORTANT
    label: Premenstrual dysphoric disorder
    essentials:
      - cyclical symptom pattern and prospective confirmation
      - differential from premenstrual exacerbation of another disorder
      - principal treatment approaches

  - id: reproductive.menopause
    domain: reproductive
    priority: SUPPORTING
    label: Menopause-related psychiatric presentations
    essentials:
      - mood and sleep symptoms in context
      - distinction between psychiatric disorder and menopausal symptoms
      - interaction with medical treatment and risk factors

  # ---------------------------------------------------------------------------
  # ANXIETY, OCD, TRAUMA, DISSOCIATION, SOMATIC/FUNCTIONAL
  # ---------------------------------------------------------------------------
  - id: anxiety.panic_agoraphobia
    domain: anxiety
    priority: CORE
    label: Panic disorder and agoraphobia
    essentials:
      - panic attack phenomenology and anticipatory anxiety
      - medical and substance differential
      - CBT and pharmacological treatment

  - id: anxiety.gad
    domain: anxiety
    priority: CORE
    label: Generalised anxiety disorder
    essentials:
      - pervasive worry and associated symptoms
      - differential from depression, OCD, trauma, substances and medical causes
      - psychological and pharmacological treatment

  - id: anxiety.social
    domain: anxiety
    priority: IMPORTANT
    label: Social anxiety disorder
    essentials:
      - fear of scrutiny and impairment
      - distinction from avoidant personality, autism and ordinary shyness
      - CBT and pharmacological treatment

  - id: anxiety.specific_phobia
    domain: anxiety
    priority: SUPPORTING
    label: Specific phobias and performance anxiety
    essentials:
      - diagnosis and differential
      - exposure-based treatment
      - limited context-specific pharmacological roles

  - id: ocd.core
    domain: ocd
    priority: CORE
    label: Obsessive-compulsive disorder
    essentials:
      - obsessions and compulsions with insight variation
      - differential from delusions, worry, rumination and OCPD
      - ERP and pharmacological treatment
      - treatment-resistant OCD

  - id: ocd.related
    domain: ocd
    priority: IMPORTANT
    label: Obsessive-compulsive and related disorders
    essentials:
      - body dysmorphic disorder
      - hoarding disorder
      - trichotillomania and excoriation disorder
      - clinically important distinctions from OCD

  - id: trauma.ptsd
    domain: trauma
    priority: CORE
    label: Post-traumatic stress disorder
    essentials:
      - trauma exposure and core symptom clusters
      - differential diagnosis and comorbidity
      - trauma-focused psychotherapy and EMDR
      - pharmacological treatment where appropriate

  - id: trauma.acute_adjustment
    domain: trauma
    priority: IMPORTANT
    label: Acute stress disorder and adjustment disorder
    essentials:
      - temporal and phenomenological distinctions
      - relation to PTSD
      - proportional management and avoidance of over-medicalisation

  - id: trauma.prolonged_grief
    domain: trauma
    priority: SUPPORTING
    label: Prolonged grief disorder
    essentials:
      - distinction from normal bereavement, depression and PTSD
      - functional impairment and treatment principles

  - id: dissociation.disorders
    domain: dissociation
    priority: IMPORTANT
    label: Dissociative disorders
    essentials:
      - depersonalisation/derealisation and dissociative amnesia/identity phenomena
      - trauma association without assuming causality in every case
      - differential from psychosis, epilepsy, neurological illness and feigned symptoms

  - id: somatic.ssd_illness_anxiety
    domain: somatic
    priority: IMPORTANT
    label: Somatic symptom disorder and illness anxiety disorder
    essentials:
      - excessive health-related thoughts, feelings and behaviours
      - distinction from appropriate concern about genuine disease
      - longitudinal, non-iatrogenic management

  - id: functional.fnd
    domain: somatic
    priority: CORE
    label: Functional neurological disorder
    essentials:
      - positive clinical diagnosis rather than diagnosis by exclusion alone
      - neurological differential and comorbidity
      - clear communication of diagnosis
      - multidisciplinary treatment

  - id: deception.factitious_malingering
    domain: somatic
    priority: IMPORTANT
    label: Factitious disorder and malingering
    essentials:
      - internal versus external incentives
      - distinction from FND and somatic symptom disorders
      - safe, non-confrontational clinical management and forensic implications

  # ---------------------------------------------------------------------------
  # SUBSTANCE-RELATED AND ADDICTIVE DISORDERS
  # ---------------------------------------------------------------------------
  - id: addiction.assessment
    domain: addiction
    priority: CORE
    label: Assessment and formulation of substance use disorders
    essentials:
      - pattern, quantity, route, intoxication, withdrawal and harms
      - craving, impaired control and dependence concepts
      - psychiatric and medical comorbidity
      - motivational interviewing, harm reduction and relapse-prevention principles

  - id: alcohol.withdrawal
    domain: addiction
    priority: CORE
    label: Alcohol withdrawal
    essentials:
      - uncomplicated withdrawal, seizures and delirium tremens
      - benzodiazepine-based treatment principles
      - thiamine and medical monitoring
      - recognition of complications

  - id: alcohol.wernicke_korsakoff
    domain: addiction
    priority: IMPORTANT
    label: Wernicke encephalopathy and Korsakoff syndrome
    essentials:
      - clinical suspicion and emergency thiamine treatment
      - cognitive syndrome and differential diagnosis
      - prevention in alcohol-related presentations

  - id: alcohol.long_term
    domain: addiction
    priority: CORE
    label: Long-term treatment of alcohol use disorder
    essentials:
      - relapse-prevention pharmacotherapy
      - psychosocial treatment
      - medical and psychiatric comorbidity
      - harm reduction and recovery goals

  - id: opioids.oud
    domain: addiction
    priority: CORE
    label: Opioid use disorder
    essentials:
      - intoxication, overdose and withdrawal
      - opioid agonist treatment and antagonist approaches
      - overdose prevention
      - psychosocial and harm-reduction care

  - id: cannabis.psychiatry
    domain: addiction
    priority: CORE
    label: Cannabis-related psychiatric syndromes
    essentials:
      - acute effects and cannabis use disorder
      - relationship with psychosis and first-episode psychosis
      - cannabis-induced versus primary psychotic disorder
      - motivational and relapse-prevention treatment

  - id: stimulants.disorders
    domain: addiction
    priority: IMPORTANT
    label: Stimulant-related disorders
    essentials:
      - intoxication and withdrawal
      - stimulant-induced psychosis
      - cardiovascular and behavioural risk
      - treatment principles

  - id: sedatives.dependence
    domain: addiction
    priority: CORE
    label: Benzodiazepine and sedative-hypnotic dependence
    essentials:
      - tolerance, dependence and withdrawal
      - seizure risk and gradual tapering principles
      - iatrogenic dependence and safer prescribing

  - id: nicotine.tobacco
    domain: addiction
    priority: IMPORTANT
    label: Tobacco and nicotine dependence
    essentials:
      - dependence and cessation treatment
      - interaction of smoking with psychotropic metabolism
      - high physical-health burden in severe mental illness

  - id: addiction.other_substances
    domain: addiction
    priority: SUPPORTING
    label: Other clinically important psychoactive substances
    essentials:
      - hallucinogens and dissociatives
      - inhalants
      - caffeine and other common agents where clinically relevant
      - substance-induced psychiatric syndromes

  - id: addiction.toxicology_testing
    domain: addiction
    priority: SUPPORTING
    label: Toxicology testing in psychiatry
    essentials:
      - indications and limitations
      - interpretation in relation to timing, false results and clinical context

  - id: gambling.disorder
    domain: addiction
    priority: IMPORTANT
    label: Gambling disorder
    essentials:
      - diagnosis and harms
      - psychiatric comorbidity and suicide risk
      - psychological and service-based treatment

  # ---------------------------------------------------------------------------
  # DELIRIUM, NEUROCOGNITIVE, OLD AGE, NEUROPSYCHIATRY, LIAISON
  # ---------------------------------------------------------------------------
  - id: delirium.core
    domain: neurocognitive
    priority: CORE
    label: Delirium
    essentials:
      - acute disturbance of attention/awareness with fluctuation
      - predisposing and precipitating causes
      - distinction from dementia, depression and primary psychosis
      - causal and non-pharmacological treatment, with cautious symptomatic medication only when needed

  - id: neurocognitive.assessment
    domain: neurocognitive
    priority: CORE
    label: Assessment of suspected major neurocognitive disorder
    essentials:
      - cognitive domains and functional decline
      - collateral history and baseline function
      - potentially reversible contributors
      - cognitive testing, laboratory assessment and neuroimaging

  - id: dementia.alzheimer
    domain: neurocognitive
    priority: CORE
    label: Alzheimer's disease
    essentials:
      - characteristic cognitive presentation and course
      - diagnostic assessment and differential
      - cholinesterase inhibitors and memantine
      - psychosocial, caregiver and safety management

  - id: dementia.dlb_pdd
    domain: neurocognitive
    priority: CORE
    label: Dementia with Lewy bodies and Parkinson's disease dementia
    essentials:
      - characteristic cognitive, perceptual, motor and autonomic features
      - distinction between DLB and PDD
      - REM sleep behaviour disorder
      - antipsychotic sensitivity and treatment principles

  - id: dementia.ftd
    domain: neurocognitive
    priority: IMPORTANT
    label: Frontotemporal dementia
    essentials:
      - behavioural and language variants
      - distinction from psychiatric illness and Alzheimer's disease
      - behavioural management and caregiver issues

  - id: dementia.vascular
    domain: neurocognitive
    priority: IMPORTANT
    label: Vascular cognitive impairment and vascular dementia
    essentials:
      - temporal relationship with cerebrovascular disease and executive dysfunction
      - mixed pathology
      - vascular risk management and rehabilitation

  - id: dementia.bpsd
    domain: neurocognitive
    priority: CORE
    label: Behavioural and psychological symptoms of dementia
    essentials:
      - search for pain, delirium, environment and unmet needs
      - non-pharmacological management first
      - careful use and risk of psychotropics
      - caregiver support and safeguarding

  - id: old_age.principles
    domain: old_age
    priority: IMPORTANT
    label: Core principles of old-age psychiatry
    essentials:
      - multimorbidity, frailty and polypharmacy
      - altered pharmacokinetics and adverse-effect vulnerability
      - capacity, safeguarding and social context
      - sensory impairment and atypical presentations

  - id: old_age.self_neglect
    domain: old_age
    priority: IMPORTANT
    label: Severe self-neglect and Diogenes-type presentations
    essentials:
      - differential including dementia, depression, psychosis, hoarding and substance use
      - capacity and autonomy
      - environmental, safeguarding and social risks
      - limitations of the Diogenes label

  - id: neuropsychiatry.autoimmune_encephalitis
    domain: neuropsychiatry
    priority: IMPORTANT
    label: Autoimmune encephalitis presenting psychiatrically
    essentials:
      - rapid or atypical psychiatric presentation with neurological red flags
      - seizures, movement disorder, autonomic change and fluctuating consciousness
      - appropriate neurological investigation and urgent multidisciplinary management

  - id: neuropsychiatry.epilepsy
    domain: neuropsychiatry
    priority: IMPORTANT
    label: Epilepsy and psychiatry
    essentials:
      - ictal, postictal and interictal psychiatric phenomena
      - depression, psychosis and suicide risk
      - psychiatric effects of antiseizure medication
      - psychotropic effects on seizure threshold and interactions

  - id: neuropsychiatry.tbi
    domain: neuropsychiatry
    priority: IMPORTANT
    label: Traumatic brain injury and psychiatric sequelae
    essentials:
      - cognitive impairment
      - mood and behavioural change
      - personality change, aggression and psychosis
      - rehabilitation and medication sensitivity

  - id: neuropsychiatry.parkinson
    domain: neuropsychiatry
    priority: IMPORTANT
    label: Parkinson's disease and psychiatry
    essentials:
      - depression, anxiety, apathy and cognitive impairment
      - psychosis and medication-related behavioural syndromes
      - treatment choices mindful of motor symptoms and cognition

  - id: neuropsychiatry.other_neurological
    domain: neuropsychiatry
    priority: SUPPORTING
    label: Psychiatric syndromes in other major neurological disorders
    essentials:
      - stroke
      - Huntington's disease
      - multiple sclerosis
      - CNS infection and brain tumour

  - id: neuropsychiatry.charles_bonnet
    domain: neuropsychiatry
    priority: SUPPORTING
    label: Charles Bonnet syndrome and related visual perceptual syndromes
    essentials:
      - visual hallucinations in visual impairment
      - preserved insight and differential from delirium, psychosis and neurodegenerative disease

  - id: liaison.core
    domain: liaison
    priority: CORE
    label: Consultation-liaison psychiatry
    essentials:
      - psychiatric assessment in medically ill patients
      - delirium and capacity in treatment refusal
      - medically caused psychiatric symptoms
      - organ dysfunction, interactions and polypharmacy in psychotropic prescribing

  # ---------------------------------------------------------------------------
  # DEVELOPMENTAL, EATING, SLEEP, PERSONALITY, SEXUAL PSYCHIATRY
  # ---------------------------------------------------------------------------
  - id: child.assessment
    domain: developmental
    priority: IMPORTANT
    label: Child and adolescent psychiatric assessment
    essentials:
      - developmental formulation and age-appropriate psychopathology
      - multiple informants and school/family context
      - safeguarding and consent/assent considerations

  - id: child.safeguarding
    domain: developmental
    priority: CORE
    label: Child abuse, neglect and safeguarding
    essentials:
      - physical, sexual and emotional abuse and neglect
      - collateral information and multidisciplinary safeguarding
      - immediate safety and mandatory/legal duties as applicable
      - trauma and attachment-related consequences without over-attribution

  - id: developmental.adhd
    domain: developmental
    priority: CORE
    label: ADHD across the lifespan
    essentials:
      - developmental onset and cross-situational impairment
      - major differential diagnoses and comorbidities
      - pharmacological and non-pharmacological treatment
      - adult presentation and transition of care

  - id: developmental.autism
    domain: developmental
    priority: CORE
    label: Autism spectrum disorder across the lifespan
    essentials:
      - social-communication and restricted/repetitive domains
      - differential diagnosis and common comorbidity
      - masking/camouflaging and variable adult presentations
