      - enzyme induction and drug interactions
      - haematological, hepatic and electrolyte monitoring

  - id: psychopharm.benzodiazepines_hypnotics
    domain: psychopharmacology
    priority: CORE
    label: Safe use of benzodiazepines and hypnotics
    essentials:
      - appropriate short-term indications
      - dependence, tolerance and withdrawal
      - respiratory, cognitive and falls risk
      - deprescribing/tapering principles

  - id: psychopharm.adhd
    domain: psychopharmacology
    priority: CORE
    label: ADHD pharmacotherapy
    essentials:
