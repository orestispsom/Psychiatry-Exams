schema_version: 1
updated: 2026-08-18
status: seeded_provisional

purpose: >-
  Protect high-yield exact recall, classic distinctions, criterion/timing facts and drug-specific
  examination probes underneath the 100 coherent Adult Psychiatry questions. This layer exists
  because a candidate may understand a topic well enough for a viva answer yet still miss a
  short factual oral probe or MCQ. It is not a second curriculum and must not become encyclopaedic.

relationship_to_other_layers:
  core_coverage: core-coverage.yml defines what must be understood conceptually and clinically.
  visible_questions: attempts/010.md provides the 100 coherent viva prompts.
  answer_coverage: answer-coverage/010.yml defines must-not-miss clinical content.
  board_facts: this file defines precise or classic facts that must be retrievable within those 100 packages.

rules:
  - An anchor is included only when exact recall would plausibly discriminate board performance or is directly supported by the curated Greek oral/MCQ material.
  - Prefer prompts and expected scope over storing possibly outdated numerical answers at this stage.
  - Exact diagnostic criteria must be verified from the designated exam classification source before finalisation.
  - Exact doses, levels, interaction thresholds, monitoring schedules, pregnancy restrictions and licensing must be verified from current authoritative prescribing/regulatory sources before finalisation.
  - Historical or legacy exam facts may remain, but final material must label them as exam-specific/historical when they differ from current practice.
  - A fact anchor does not justify a new main question by itself.
  - Every final anchor must be attached to at least one of the 100 answer packages.

verification_states:
  EXAM_SOURCE_REQUIRED: verify against the designated exam textbook/classification edition.
  CURRENT_SOURCE_REQUIRED: verify against current authoritative clinical/prescribing/regulatory sources.
  EXAM_CURRENT_SPLIT_REQUIRED: explicitly preserve exam-source answer and current-practice answer if they differ.
  STABLE_SOURCE_CHECK: stable concept, but verify wording before publication.

