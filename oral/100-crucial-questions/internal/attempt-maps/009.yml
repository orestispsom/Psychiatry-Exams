jurisdiction_changes:
  Q8:
    change: >-
      Reworded from generic decision-making capacity terminology to ability to provide valid
      informed consent for a specific treatment decision.
    greek_anchor: Law 3418/2005 Article 12 and current applicable Greek law.

  Q90a:
    change: >-
      Explicitly asks for Greek legal and ethical issues when urgent ECT is considered and the
      patient appears unable to provide valid informed consent.
    rule: Do not import UK Mental Health Act or US substitute-consent frameworks.

  Q98:
    change: >-
      Confidentiality question explicitly governed by Greek law and medical ethics.
    greek_anchor: Law 3418/2005 Article 13 and other current applicable Greek law.

  Q98a:
    change: >-
      Removed Tarasoff-style identifiable-victim framing. The prompt now asks how to reason about
      a serious imminent threat under Greek confidentiality law and professional duties.
    rule: Do not state a US-style duty to warn/protect as the Greek rule unless current Greek law supports it.

  Q99:
    change: >-
      Criminal-responsibility forensic assessment explicitly anchored to the Greek legal context.
    greek_anchor: Current Greek Penal Code, including Article 34 where applicable.

