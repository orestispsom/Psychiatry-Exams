  # Suggested prefixes: C_DEF, C_DIAG, C_DIFF, C_RISK, C_INV, C_TX, C_MON,
  # C_AE, C_PROG, C_MECH, C_EXAM, C_LAW, C_FACT.
  - id: C_PLACEHOLDER_01
    proposition: ""
    domain: ""
    importance: CORE   # CORE | IMPORTANT | SUPPORTING
    truth_scope: BOTH  # EXAM | CURRENT | BOTH | HISTORICAL
    source_refs: []
    support_notes: ""
    conflict_refs: []
    adjudication: UNRESOLVED_BLOCK
    destination: UNASSIGNED  # SPOKEN_CORE | MUST_COVER_EXTENSION | BOARD_FACT | FOLLOWUP | EXAM_CURRENT_NOTE | EXCLUDE
    writer_note: ""
    commercial_provenance:
      expression_origin: ORIGINAL_SYNTHESIS
      # ORIGINAL_SYNTHESIS | GENERAL_FACT_PATTERN | SOURCE_STRUCTURE_INFLUENCE |
      # CLOSE_PARAPHRASE_RISK | DIRECT_QUOTATION | PROPRIETARY_OR_LICENSED_TEXT
      commercial_clearance: NOT_REVIEWED
      # NOT_REVIEWED | LOW_RISK | REWRITE_REQUIRED | PERMISSION_OR_LICENSE_CHECK |
      # EXCLUDE_FROM_COMMERCIAL | CLEARED_FOR_COMMERCIAL_DRAFT
      source_expression_note: ""

conflicts:
  # Never silently reconcile incompatible sources.
  - id: X_PLACEHOLDER_01
    topic: ""
    exam_source_position: ""
    current_source_position: ""
    significance: ""
    adjudication: UNRESOLVED_BLOCK
